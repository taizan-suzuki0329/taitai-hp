<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>準備中｜TAITAIサポート株式会社</title>
<style>
:root{--blue:#1A56D6;--navy:#14213D;--gray:#1F2937;--pale:#EEF4FB;--line:#DCE4F0;--font:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--navy);font-family:var(--font);font-size:16px;line-height:1.8}
.wrap{max-width:540px;margin:0 auto;padding:0 0 40px}
header{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
header img{height:38px;width:auto}
header .t{font-size:22px;font-weight:800;line-height:1.15}
header .t small{display:block;font-size:11px;font-weight:600;letter-spacing:.18em;color:#5B6B85}
.band{background:var(--blue);color:#fff;font-weight:700;padding:10px 18px;font-size:15px}
section{padding:28px 18px}
.card{border:1px solid var(--line);border-radius:14px;padding:28px 18px;background:var(--pale);text-align:center}
.card .logo{width:180px;max-width:70%;height:auto;margin:0 auto 14px;display:block}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:0;font-size:15px;color:var(--gray)}
.back{display:block;text-align:center;color:var(--blue);font-weight:700;text-decoration:none;margin-top:18px;font-size:14px}
footer{padding:22px 18px 16px;text-align:center;font-size:12px;color:#5B6B85;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<header><img src="images/logo.png" alt="TAITAI SUPPORT"><div class="t">準備中<small>COMING SOON</small></div></header>
<div class="band">ただいま準備中です</div>
<section>
  <div class="card">
    <img class="logo" src="images/logo.png" alt="TAITAI SUPPORT">
    <h2>準備中です。</h2>
    <p>もうしばらくお待ちください。</p>
  </div>
  <a class="back" href="index.html">← ホームへ戻る</a>
</section>
<footer>© TAITAI SUPPORT Co., Ltd.</footer>
</div>
</body>
</html>
