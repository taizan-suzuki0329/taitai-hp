<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex">
<title>タイタイに相談｜TAITAIサポート</title>
<style>
:root{--blue:#0066FF;--ink:#14213D;--sub:#6b7280;--bg:#f5f7fb;--ai:#ffffff;--me:#d9e8ff;--line:#e3e8f0;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column;height:100dvh}
header{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
header img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#eaf2ff}
header b{font-size:17px}header small{display:block;color:var(--sub);font-size:12px}
#log{flex:1;overflow-y:auto;padding:16px 12px 8px;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:8px;margin:0 0 12px;align-items:flex-end}
.row.me{justify-content:flex-end}
.row.ai img{width:32px;height:32px;border-radius:50%;flex:none;background:#eaf2ff}
.bub{max-width:78%;padding:10px 14px;border-radius:18px;font-size:15.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.ai .bub{background:var(--ai);border-top-left-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.me .bub{background:var(--me);border-top-right-radius:6px}
.bub b{color:var(--blue)}
.sys{text-align:center;color:var(--sub);font-size:12.5px;margin:6px 0 12px}
.note{margin-top:8px;background:#fff8e6;border:1px solid #ffd27a;border-radius:12px;padding:8px 10px;font-size:13.5px}
.draft{margin-top:8px;background:#f2f7ff;border:1.5px dashed #8db6ff;border-radius:12px;padding:8px 10px}
.draft button{margin-top:6px;border:0;background:var(--blue);color:#fff;border-radius:12px;padding:6px 12px;font-size:13px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#b3b7bf;animation:d 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes d{0%,80%,100%{opacity:.3}40%{opacity:1}}
form{flex:none;display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font:inherit;font-size:16px;max-height:120px;outline:none}
button.send{width:44px;height:44px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:18px;flex:none}
button.send:disabled{background:#c9d2e0}
#closed{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#closed img{width:120px;height:120px;border-radius:50%;background:#eaf2ff}
#closed p{margin:0;line-height:1.8}
</style>
</head>
<body>
<header><img src="images/taitai-chat.webp" alt=""><div><b>タイタイ</b><small>TAITAIサポートの相談係（AI）</small></div></header>

<div id="closed"><img src="images/taitai-chat.webp" alt=""><p><b>タイタイだよ！😊</b><br>AIのタイタイは、いま準備中です。<br>ご相談は、LINEのトークにそのまま書いてください。<br>太山さんから順番にお返事しますね。</p></div>

<div id="log" aria-live="polite"></div>
<form id="f"><textarea id="inp" rows="1" placeholder="メッセージを入力" enterkeyhint="send"></textarea><button class="send" id="send" type="submit" aria-label="送る">➤</button></form>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// 設定（公式LINE専用チャット 🍪CK 2026-11-15）。鍵はここに書かない。
const CONFIG = {
  LIFF_ID: "",   // LINE DevelopersのLIFF ID
  API_URL: ""    // GASウェブアプリの …/exec のURL
};
const ICON = "images/taitai-chat.webp";
const GREETING = "タイタイだよ！😊 今日はどうしたの？";
const $ = s => document.querySelector(s);
const log = $("#log"), inp = $("#inp"), btn = $("#send");
let idToken = "", busy = false;

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function fmt(s){
  let h = esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  h = h.replace(/\[\[DRAFT\]\]([\s\S]*?)(\[\[\/DRAFT\]\]|$)/g,(m,t)=>`<div class="draft">${t.trim()}<br><button type="button" data-copy="${encodeURIComponent(t.trim())}">コピーする</button></div>`);
  h = h.replace(/\[\[ESCALATE\]\]([\s\S]*?)(\[\[\/ESCALATE\]\]|$)/g,()=>`<div class="note">📲 太山さんに伝えました。お返事はこのLINEか、次にここを開いたときにお知らせします。</div>`);
  return h;
}
function add(who, html){
  const r=document.createElement("div"); r.className="row "+who;
  r.innerHTML=(who==="ai"?`<img src="${ICON}" alt="">`:"")+`<div class="bub">${html}</div>`;
  log.appendChild(r); log.scrollTop=log.scrollHeight; return r.querySelector(".bub");
}
function sys(t){const d=document.createElement("div");d.className="sys";d.textContent=t;log.appendChild(d);}
log.addEventListener("click",e=>{const b=e.target.closest("[data-copy]"); if(!b)return; navigator.clipboard.writeText(decodeURIComponent(b.dataset.copy)).then(()=>{b.textContent="コピーしました";});});

function closed(){ $("#log").style.display="none"; $("#f").style.display="none"; $("#closed").style.display="flex"; }

async function api(body){
  const r = await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({idToken},body))});
  return r.json();
}

async function start(){
  if(!CONFIG.LIFF_ID || !CONFIG.API_URL){ closed(); return; }
  try{
    await liff.init({liffId:CONFIG.LIFF_ID});
    if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return; }
    idToken = liff.getIDToken() || "";
  }catch(e){ closed(); return; }
  const wait = add("ai",'<span class="dots"><span></span><span></span><span></span></span>');
  let hello = {};
  try{ hello = await api({action:"hello"}); }catch(e){}
  if(hello.closed){ wait.parentNode.remove(); closed(); return; }
  wait.innerHTML = fmt(GREETING);
  (hello.pending||[]).forEach(p=>add("ai",fmt(`前に聞いてくれた「${p.q}」のこと、太山さんからお返事があったよ！\n\n${p.a}`)));
  inp.focus();
}

async function send(){
  const t = inp.value.trim(); if(!t||busy) return;
  busy=true; btn.disabled=true; inp.value=""; inp.style.height="auto";
  add("me",esc(t));
  const b = add("ai",'<span class="dots"><span></span><span></span><span></span></span>');
  try{
    const r = await api({action:"chat",message:t});
    b.innerHTML = fmt(r.reply || "ごめんね、うまく返事ができなかったよ🙏 LINEのトークに書いてくれたら、太山さんがお返事します。");
  }catch(e){
    b.innerHTML = fmt("ごめんね、通信がうまくいかなかったよ🙏 少し待ってからもう一度送ってね。");
  }
  busy=false; btn.disabled=false; log.scrollTop=log.scrollHeight;
}
$("#f").addEventListener("submit",e=>{e.preventDefault();send();});
inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();} });
inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,120)+"px";});
start();
</script>
</body>
</html>
