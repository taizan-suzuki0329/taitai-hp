<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut,maximum-scale=1">
<title>タイタイ｜TAITAIサポート</title>
<style>
  :root{--blue:#2f6fd6;--ink:#1f2328;--sub:#8a8f98;--red:#CC0000;--aibub:#ececee;--mebub:#c7ddf7}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);overflow:hidden;background:#f7f7f8}

  /* 相談画面 */
  #chat{position:fixed;inset:0;background:#f7f7f8;display:flex;flex-direction:column}

  /* 上：顔が動く */
  header{position:absolute;top:0;left:0;right:0;z-index:5;height:250px;pointer-events:none;
         background:linear-gradient(to bottom,rgba(247,247,248,.97) 55%,rgba(247,247,248,0))}
  .hbtn{pointer-events:auto;position:absolute;top:22px;height:52px;min-width:52px;padding:0 16px;border:0;border-radius:26px;background:#fff;
        box-shadow:0 3px 12px rgba(0,0,0,.08);font-size:15px;color:var(--ink);cursor:pointer;font-family:inherit}
  #closeBtn{left:14px;font-size:20px;padding:0}
  #voiceBtn{right:14px}
  #faceWrap{position:absolute;left:50%;top:44px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
  #face{width:140px;height:140px;border-radius:50%;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 35%,#ffffff 0%,#e3efff 55%,#cfe2ff 100%);border:4px solid #fff;
        box-shadow:0 6px 18px rgba(47,111,214,.18);transform-origin:50% 85%;animation:breathe 4s ease-in-out infinite}
  #face img{width:100%;height:100%;display:block}
  #mouth{position:absolute;left:54.5%;top:68.5%;width:12%;height:9%;margin-left:-6%;border-radius:45% 45% 55% 55%;
         background:#7b3a2c;transform:scaleY(0);transform-origin:50% 20%;box-shadow:inset 0 -2px 0 #c96b6b}
  .namepill{margin-top:-14px;background:#fff;border-radius:16px;padding:5px 16px;font-weight:800;font-size:15px;color:#2b5fd9;letter-spacing:.06em;box-shadow:0 3px 10px rgba(0,0,0,.08);
            display:flex;align-items:center;gap:6px;position:relative}
  .dot{width:8px;height:8px;border-radius:50%;background:#facc15}
  .dot.ok{background:#22c55e}.dot.ng{background:#ef4444}
  /* 丸の中でタイタイがゆらゆら＆ときどきぴょん */
  #face img{transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:translateY(0) rotate(-4deg)}20%{transform:translateY(-5px) rotate(3deg)}40%{transform:translateY(0) rotate(-3deg)}60%{transform:translateY(-4px) rotate(4deg)}
    78%{transform:translateY(0) rotate(0)}84%{transform:translateY(-16px) scale(.97,1.04) rotate(0)}90%{transform:translateY(0) scale(1.05,.95)}95%{transform:translateY(-3px) scale(1)}}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  @keyframes idle{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-3px)}}
  #face.talk{animation:talkHead .5s ease-in-out infinite}
  #face.talk #mouth{animation:mouth .22s ease-in-out infinite alternate}
  @keyframes talkHead{0%,100%{transform:rotate(-3deg) translateY(0) scale(1)}50%{transform:rotate(2deg) translateY(-3px) scale(1.03,.98)}}
  @keyframes mouth{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
  #face.think{animation:think 1.6s ease-in-out infinite}
  @keyframes think{0%,100%{transform:rotate(-9deg) translateY(-1px)}50%{transform:rotate(-5deg) translateY(-4px)}}
  #face.hop{animation:hop .6s cubic-bezier(.3,1.6,.5,1) 1}
  @keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-16px) scale(.96,1.05)}60%{transform:translateY(0) scale(1.06,.95)}100%{transform:none}}
  #face.nod{animation:nod .7s ease-in-out 1}
  @keyframes nod{0%,100%{transform:none}30%{transform:translateY(5px) rotate(2deg)}60%{transform:translateY(-1px)}}
  #thinkBubble{position:absolute;right:-30px;top:4px;background:#fff;border-radius:14px;padding:6px 9px;box-shadow:0 3px 10px rgba(0,0,0,.1);opacity:0;transition:opacity .25s}
  #faceWrap.thinking #thinkBubble{opacity:1}

  /* チャット */
  #log{flex:1;overflow-y:auto;padding:262px 16px 10px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;animation:pop .3s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
  .row.me{justify-content:flex-end}
  .bub{max-width:86%;padding:14px 18px;border-radius:26px;font-size:16.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .ai .bub{background:var(--aibub)}
  .me .bub{background:var(--mebub)}
  .bub strong{color:#0066FF;font-weight:800}
  .dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#b3b7bf;animation:b 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
  .sys{align-self:center;font-size:12.5px;color:var(--sub);text-align:center;max-width:90%;line-height:1.5}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px}
  .chips button{flex:none;border:1.5px solid #c7ddf7;background:#fff;color:var(--ink);border-radius:20px;padding:9px 15px;font-size:14px;cursor:pointer;font-family:inherit}
  form{margin:0 14px calc(14px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:flex-end;background:#fff;border-radius:30px;padding:7px 7px 7px 18px;box-shadow:0 3px 14px rgba(0,0,0,.07)}
  textarea{flex:1;resize:none;border:0;outline:0;padding:11px 0;font-size:16.5px;font-family:inherit;max-height:110px;line-height:1.4;background:transparent}
  .rb{width:44px;height:44px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:17px;cursor:pointer;flex:none}
  .rb:disabled{background:#d5d9e0}
  @media (min-width:700px){#chat{max-width:520px;left:50%;margin-left:-260px;box-shadow:0 0 40px rgba(0,0,0,.08)}}
  .draft{margin-top:10px;background:#f2f7ff;border:1.5px dashed #8db6ff;border-radius:16px;padding:10px 12px;white-space:pre-wrap}
  .draft .dl{font-size:12px;color:#3b6fc2;font-weight:700;margin-bottom:4px}
  .draft .copy{margin-top:8px;border:0;background:#2f6fd6;color:#fff;border-radius:14px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  .esc{margin-top:10px;background:#fff8ea;border:1.5px solid #ffd27a;border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px}
  .esc small{display:block;font-weight:500;color:#555;margin-top:4px;font-size:13px}
  .esc em{display:block;font-style:normal;font-weight:500;color:#9a9a9a;font-size:11.5px;margin-top:4px}
  .backbtn{display:block;margin:6px auto 0;border:0;background:#06c755;color:#fff;border-radius:22px;padding:12px 22px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
</style>
</head>

<script>
// ▼ 設定（ここだけ書きかえる。APIの鍵はここに書かない）
const CONFIG = {
  LIFF_ID: "",   // LINE DevelopersのLIFF ID（マイページと同じLINEログインチャネルに追加したもの）
  API_URL: "https://script.google.com/macros/s/AKfycbxpFMpw5dVCtMZIK4OGSTd61OtA2Klie5OfXEWw43cffsF4UiOGoQp4xjTrJsfvbD3P/exec"    // GASの「ウェブアプリ」のURL
};
const CLOSED_TEXT = "**タイタイだよ！**😊\nAIのチャットは、いま準備中です。\nご相談は、LINEのトークにそのまま書いてくださいね。太山さんから順番にお返事します。";

const $ = s => document.querySelector(s);
const log = $("#log"), inp = $("#inp"), sendBtn = $("#send"), chara = $("#face");
let idToken = "", anonId = "", busy = false;
const DOTS = '<span class="dots"><span></span><span></span><span></span></span>';

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(s){
  let h = esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/\[\[DRAFT\]\]([\s\S]*?)(\[\[\/DRAFT\]\]|$)/g, (m,t)=>`<div class="draft"><div class="dl">📝 太山さんに送る文（コピーしてLINEのトークへ）</div><div class="dt">${t.trim()}</div><button type="button" class="copy">コピーする</button></div>`);
  h = h.replace(/\[\[ESCALATE\]\]([\s\S]*?)(\[\[\/ESCALATE\]\]|$)/g, ()=>`<div class="esc">📲 太山さんに伝えました<small>お返事が来たら、次にこの画面を開いたときにお知らせしますね。</small></div>`);
  return h;
}
function add(who, html){
  const r = document.createElement("div"); r.className = "row " + who;
  r.innerHTML = '<div class="bub"></div>'; r.firstChild.innerHTML = html;
  log.appendChild(r); log.scrollTop = log.scrollHeight; return r.firstChild;
}
function sys(t){ const d=document.createElement("div"); d.className="sys"; d.textContent=t; log.appendChild(d); log.scrollTop=log.scrollHeight; }
function mood(m){ chara.classList.remove("talk","think","hop"); $("#faceWrap").classList.toggle("thinking", m==="think"); if(m){ void chara.offsetWidth; chara.classList.add(m); } }
function hop(){ mood("hop"); setTimeout(()=>{ if(chara.classList.contains("hop")) mood(null); }, 650); }
function talkFor(text){ mood("talk"); setTimeout(()=>{ if(chara.classList.contains("talk")) mood(null); }, Math.min(4000, 600 + text.length*45)); }
function setDot(cls){ $("#dot").className = "dot " + cls; }
const wait = ms => new Promise(r => setTimeout(r, ms));
async function say(text){ const b = add("ai", DOTS); await wait(700); b.innerHTML = fmt(text); talkFor(text); log.scrollTop = log.scrollHeight; }

function inLine(){ try{ return liff.isInClient(); }catch(e){ return false; } }
function closeWin(){ if(inLine()) liff.closeWindow(); else history.back(); }

async function api(body){
  const r = await fetch(CONFIG.API_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ idToken, anonId }, body)) });
  return r.json();
}

async function closedMode(text){
  setDot("");
  await say(text || CLOSED_TEXT);
  const b = document.createElement("button"); b.className = "backbtn"; b.textContent = "LINEのトークに戻る"; b.onclick = closeWin;
  log.appendChild(b);
}

async function start(){
  hop();
  if(!CONFIG.API_URL){ return closedMode(); }
  if(CONFIG.LIFF_ID){
    try{
      await liff.init({ liffId: CONFIG.LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
      idToken = liff.getIDToken() || "";
    }catch(e){ idToken = ""; }
  }
  // LINEのつなぎができるまでの仮：この端末の番号で見分ける
  try{ anonId = localStorage.getItem("taitai_uid") || ""; if(!anonId){ anonId = crypto.randomUUID(); localStorage.setItem("taitai_uid", anonId); } }catch(e){ anonId = anonId || crypto.randomUUID(); }

  const w = add("ai", DOTS);
  let h;
  try{ h = await api({ action:"hello" }); }catch(e){ h = { error:"net" }; }
  w.parentNode.remove();
  if(h.closed) return closedMode();
  if(h.error){ return closedMode("ごめんなさい、いまうまくつながりませんでした。少し時間をおいて、もう一度「CHAT」から開いてください🙏"); }
  setDot("ok");
  await say(h.returning ? "**おかえり！タイタイだよ**😊\n今日はどうしたの？" : "**タイタイだよ！**😊\n今日はどうしたの？");
  for(const p of (h.pending || [])){
    await say(`それと、前に聞いてくれた「${p.q}」のこと、**太山さんから返事が来てるよ！**\n\n${p.a}`);
  }
  $("#chips").classList.remove("hidden"); $("#f").classList.remove("hidden"); hop();
}

async function send(){
  const text = inp.value.trim(); if(!text || busy) return;
  $("#chips").classList.add("hidden");
  add("me", esc(text));
  inp.value = ""; inp.style.height = "auto"; inp.blur();
  busy = true; sendBtn.disabled = true; mood("think");
  const bub = add("ai", DOTS);
  let r;
  try{ r = await api({ action:"chat", text }); }catch(e){ r = { error:"net" }; }
  mood(null);
  if(r && r.reply){ bub.innerHTML = fmt(r.reply); talkFor(r.reply); }
  else if(r && r.closed){ bub.parentNode.remove(); await closedMode(); $("#f").classList.add("hidden"); }
  else if(r && r.error === "auth"){ bub.innerHTML = "ごめんなさい、時間がたったので一度閉じて、もう一度「CHAT」から開いてください🙏"; }
  else { bub.innerHTML = "うまくつながりませんでした。もう一度送ってください🙏"; }
  busy = false; sendBtn.disabled = false; log.scrollTop = log.scrollHeight;
}

document.addEventListener("click", e => {
  const b = e.target.closest(".copy"); if(!b) return;
  const t = b.parentNode.querySelector(".dt").innerText;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>{ b.textContent = "コピーしました ✓"; })
    .catch(()=>{ const r=document.createRange(); r.selectNodeContents(b.parentNode.querySelector(".dt")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "選んだ文字を長押しでコピー"; });
});
$("#closeBtn").onclick = closeWin;
document.querySelectorAll("#chips button").forEach(b => b.onclick = () => { inp.value = b.textContent; send(); });
inp.addEventListener("input", () => { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 110) + "px"; });
inp.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
$("#f").addEventListener("submit", e => { e.preventDefault(); send(); });
start();
</script>
</body>
</html>
