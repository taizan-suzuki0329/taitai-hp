<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>会社案内｜TAITAIサポート株式会社</title>
<meta name="description" content="日本とフィリピンをつなぎ、三方よしの未来をつくる。私たちは両国のやり取りを整えて、一緒に進めていく伴走型のサポート会社です。">
<style>
:root{--blue:#1A56D6;--blue-d:#1446B4;--navy:#14213D;--gray:#1F2937;--pale:#EEF4FB;--line:#DCE4F0;--white:#fff;--cream:#FBF3E8;--brown:#8C6A4A;--font:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--navy);font-family:var(--font);font-size:16px;line-height:1.8}
.wrap{max-width:540px;margin:0 auto;padding:0 0 110px}
.top{background:linear-gradient(180deg,#EEF4FB 0%,#F7FAFF 100%);padding:34px 20px 28px;text-align:center}
.top img{width:230px;height:auto}
.vision{margin:18px 0 0;font-weight:800;font-size:17px;line-height:1.7;background:linear-gradient(90deg,#1A56D6,#7B4DD6);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:22px 0 0;font-weight:800;font-size:17px;line-height:1.8;color:#5B6B85;text-align:left}
.team{background:var(--cream);padding:0}
.team img{display:block;width:100%;height:auto}
section{padding:20px 20px 0}
.box{border:2px solid #9DB9E8;border-radius:16px;padding:16px 18px;background:#fff}
.box h2{margin:0 0 8px;font-size:18px;font-weight:800;color:#7A6552}
.box p{margin:4px 0;font-size:15px;color:var(--gray)}
.book h2{margin:22px 0 8px;font-size:18px;font-weight:800;color:#7A6552;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.book h2 small{font-size:13px;font-weight:600;color:#5B6B85}
.btns{display:grid;gap:12px;margin-top:8px}
.btns a{display:block;text-align:center;border:3px solid var(--blue);color:var(--blue);background:#fff;font-weight:800;font-size:17px;text-decoration:none;border-radius:999px;padding:12px 16px}
.btns a:active{background:var(--pale)}
.note{font-size:12px;color:#5B6B85;margin:10px 0 0}
footer{padding:26px 20px 16px;text-align:center;font-size:12px;color:#5B6B85;line-height:1.7}
.fab{position:fixed;left:0;right:0;bottom:0;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line)}
.fab a{display:block;text-align:center;background:#06C755;color:#fff;font-weight:800;text-decoration:none;border-radius:999px;padding:13px;font-size:16px}
.fab small{display:block;text-align:center;font-size:11px;color:#5B6B85;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="images/logo.png" alt="TAITAI SUPPORT">
    <p class="vision">日本とフィリピンをつなぎ<br>三方よしの未来をつくる</p>
    <p class="lead">私たちは両国のやり取りを整えて<br>一緒に進めていく<br>伴走型のサポート会社です。</p>
  </div>

  <div class="team">
    <img src="images/team_group.jpg" alt="TAITAIのチーム：MOCCHI・TAITAI・COOKIE・JIJI・ROCKY・MOKO" width="1080" height="810">
  </div>

  <section>
    <div class="box">
      <h2>まずは無料で聞けます</h2>
      <p>LINEでヒアリング＋ワンポイントアドバイス</p>
      <p>ここからは有料です：Zoom相談 45分・税込10,000円</p>
    </div>
  </section>

  <section class="book">
    <h2>営業日とご案内<small>ご相談の受付は公式LINEです</small></h2>
    <div class="btns">
      <a href="calendar.html">営業日カレンダー</a>
      <a href="training.html">現地研修のご案内</a>
      <a href="https://lin.ee/ZaDcexp" target="_blank" rel="noopener">LINEでご相談</a>
    </div>
  </section>

  <footer>日本とフィリピンをつなぎ、一人ひとりの挑戦を確かな一歩に変え、三方よしの未来をつくる。<br>© TAITAI SUPPORT Co., Ltd.</footer>
</div>
<div class="fab"><a href="https://lin.ee/ZaDcexp" target="_blank" rel="noopener">LINEでご相談</a><small>LINEでのヒアリングは無料です</small></div>
</body></html>
