<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SNS一覧｜TAITAIサポート株式会社</title>
<style>
:root{--blue:#1A56D6;--navy:#14213D;--gray:#1F2937;--pale:#EEF4FB;--line:#DCE4F0;--font:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--navy);font-family:var(--font);font-size:16px;line-height:1.8}
.wrap{max-width:540px;margin:0 auto;padding:0 0 110px}
header{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
header img{height:38px;width:auto}
header .t{font-size:22px;font-weight:800;line-height:1.15}
header .t small{display:block;font-size:11px;font-weight:600;letter-spacing:.18em;color:#5B6B85}
.band{background:var(--blue);color:#fff;font-weight:700;padding:10px 18px;font-size:15px}
section{padding:18px}
.lead{margin:0 0 14px;font-size:15px;color:var(--gray)}
.sns{display:grid;gap:12px}
.item{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--pale);text-decoration:none;color:var(--navy)}
.item .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff;flex:none;letter-spacing:.02em}
.ic.tt{background:#111}
.ic.ig{background:linear-gradient(135deg,#F58529,#DD2A7B 55%,#8134AF)}
.ic.yt{background:#FF0000}
.item b{display:block;font-size:16px}
.item span{display:block;font-size:13px;color:var(--gray)}
.item .go{margin-left:auto;color:var(--blue);font-weight:800;flex:none}
.item.soon{opacity:.55;pointer-events:none}
.item.soon .go{color:#5B6B85}
.note{margin:14px 0 0;font-size:13px;color:#5B6B85}
.back{display:block;text-align:center;color:var(--blue);font-weight:700;text-decoration:none;margin-top:16px;font-size:14px}
.fab{position:fixed;left:0;right:0;bottom:0;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line)}
.fab a{display:block;text-align:center;background:#06C755;color:#fff;font-weight:800;text-decoration:none;border-radius:999px;padding:13px;font-size:16px}
</style>
</head>
<body>
<div class="wrap">
<header><img src="images/logo.png" alt="TAITAI SUPPORT"><div class="t">SNS一覧<small>FOLLOW US</small></div></header>
<div class="band">フィリピンのこと、SNSでも発信しています</div>
<section>
  <p class="lead">見たいものを押してください。</p>
  <div class="sns">
    <a class="item" href="https://www.tiktok.com/@moko.taitai" target="_blank" rel="noopener">
      <div class="ic tt">TikTok</div>
      <div><b>TikTok</b><span>@moko.taitai｜フィリピンの今を短い動画で</span></div>
      <div class="go">見る →</div>
    </a>
    <a class="item soon" href="#" aria-disabled="true">
      <div class="ic ig">Insta</div>
      <div><b>Instagram</b><span>準備中</span></div>
      <div class="go">準備中</div>
    </a>
    <a class="item soon" href="#" aria-disabled="true">
      <div class="ic yt">YT</div>
      <div><b>YouTube</b><span>準備中</span></div>
      <div class="go">準備中</div>
    </a>
  </div>
  <p class="note">InstagramとYouTubeは、できしだいここに並びます。</p>
  <a class="back" href="company.html">← 会社案内へ戻る</a>
</section>
</div>
<div class="fab"><a href="https://lin.ee/ZaDcexp" target="_blank" rel="noopener">LINEでご相談</a></div>
</body></html>
